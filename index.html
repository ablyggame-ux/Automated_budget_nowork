<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Budget - Système de Pilotage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0d1117; --neon-blue: #38bdf8; --neon-orange: #fb923c; --neon-green: #4ade80; --neon-yellow: #facc15; }
        body { background-color: var(--bg-color); color: #e6edf3; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
        
        @keyframes pop {
            0% { transform: scale(0) translate(-50%, -50%); opacity: 0; }
            100% { transform: scale(1) translate(-50%, -50%); opacity: 1; }
        }

        .bubble {
            animation: pop 0.4s ease-out forwards;
            position: absolute; left: 50%; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; text-align: center;
            border: 2px solid transparent; z-index: 20;
        }

        .bubble-validated { background: rgba(56, 189, 248, 0.15); border-color: var(--neon-blue); color: var(--neon-blue); }
        .bubble-pending { background: rgba(251, 146, 60, 0.15); border-color: var(--neon-orange); color: var(--neon-orange); border-style: dashed; }

        #svg-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .timeline-center { position: absolute; left: 50%; width: 2px; height: 5000px; background: rgba(255,255,255,0.05); transform: translateX(-50%); z-index: 5; }
    </style>
</head>
<body>

    <svg id="svg-bg" preserveAspectRatio="none">
        <line id="line-optimal" x1="0" y1="0" x2="0" y2="100%" stroke="#4ade80" stroke-width="1" stroke-dasharray="10,5" opacity="0.3" />
        <path id="line-realistic" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.3" />
    </svg>

    <header class="fixed top-0 w-full p-6 z-50 flex justify-between items-start bg-gradient-to-b from-[#0d1117] via-[#0d1117]/80 to-transparent">
        <div>
            <h1 class="text-xl font-bold tracking-tighter">VIBE<span class="text-blue-400">BUDGET</span></h1>
            <div id="debug-status" class="text-[10px] opacity-30 mt-1 uppercase">Connexion en cours...</div>
        </div>
        <div class="text-right">
            <span class="text-[10px] opacity-50 uppercase">Flux Mensuel</span>
            <div id="total-amount" class="text-2xl font-bold text-white">0.00€</div>
        </div>
    </header>

    <main id="timeline-container" class="relative pt-[25vh] pb-[20vh] w-full min-h-screen">
        <div class="timeline-center"></div>
        <div id="bubbles-layer"></div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxr3RkcVPhgnFJUay-sPoLMzPNUvfwaV5_pzEzruJ_9zQaIx0s-huEwFXYwzIhufIsI/exec';
        let budgetData = [];

        async function loadData() {
            const status = document.getElementById('debug-status');
            try {
                const r = await fetch(SCRIPT_URL);
                const json = await r.json();
                
                if (!json || json.length === 0) {
                    status.innerText = "ERREUR: TABLEAU VIDE";
                    return;
                }

                budgetData = json;
                status.innerText = `SYSTÈME ACTIF: ${json.length} ENTRÉES`;
                render();
            } catch (e) {
                status.innerText = "ERREUR DE CONNEXION";
                console.error(e);
            }
        }

        function render() {
            const layer = document.getElementById('bubbles-layer');
            const totalEl = document.getElementById('total-amount');
            layer.innerHTML = '';
            let total = 0;

            budgetData.forEach((item, i) => {
                // Extraction ultra-robuste des données (insensible aux majuscules)
                const amount = parseFloat(String(item.amount || item.Amount || 0).replace(',', '.')) || 0;
                const merchant = item.merchant || item.Merchant || item.label || "Inconnu";
                const dateRaw = item.date || item.Date || new Date();
                const status = (item.status || item.Status || "Pending").toLowerCase();
                
                total += amount;

                const date = new Date(dateRaw);
                const day = date.getDate() || 1;
                
                // Positionnement
                const top = day * 140; 
                const side = i % 2 === 0 ? -1 : 1;
                const xOffset = side * (70 + Math.min(amount / 5, 120));
                const size = Math.max(80, Math.min(180, 70 + Math.log10(Math.abs(amount) + 1) * 40));

                const b = document.createElement('div');
                b.className = `bubble rounded-full ${status === 'validated' ? 'bubble-validated' : 'bubble-pending'}`;
                b.style.width = `${size}px`;
                b.style.height = `${size}px`;
                b.style.top = `${top}px`;
                b.style.marginLeft = `${xOffset}px`;

                b.innerHTML = `
                    <div class="p-2 leading-none">
                        <div class="text-[8px] uppercase opacity-60 mb-1">${String(merchant).substring(0, 10)}</div>
                        <div class="text-sm font-bold">${amount.toFixed(2)}€</div>
                    </div>
                `;
                layer.appendChild(b);
            });

            totalEl.innerText = `${total.toFixed(2)}€`;
            totalEl.style.color = total > 1230 ? '#facc15' : '#4ade80';
            
            drawGuides();
        }

        function drawGuides() {
            const centerX = window.innerWidth / 2;
            const height = document.body.scrollHeight;
            
            // Guide Idéal (1230€)
            const opt = document.getElementById('line-optimal');
            opt.setAttribute('x1', centerX - 160);
            opt.setAttribute('x2', centerX - 160);
            opt.setAttribute('y2', height);

            // Guide Réaliste (1400€)
            const real = document.getElementById('line-realistic');
            let d = `M ${centerX + 160} 0`;
            for (let y = 0; y <= height; y += 40) {
                const x = (centerX + 160) + Math.sin(y / 200) * 20;
                d += ` L ${x} ${y}`;
            }
            real.setAttribute('d', d);
        }

        window.addEventListener('resize', drawGuides);
        loadData();
    </script>
</body>
</html>
